<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6C37">
<title>আল আহসান টিভি | আল আহসান ফাউন্ডেশন বাংলাদেশ</title>
<style>
:root{--or:#FF6C37;--or2:#e5531e;--bg:#fffaf6;--tx:#1f1b18;--mut:#6f6760;--bd:#f0e4db;--card:#fff;--dk:#2b1a12}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0)}
.w{max-width:1080px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.hd{display:flex;align-items:center;gap:10px;height:62px}
.lg{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff}
.bn b{display:block;font-size:1.05rem;line-height:1.2}.bn small{color:var(--mut);font-size:.72rem}
nav{margin-left:auto;display:flex;gap:4px}nav a{padding:7px 12px;border-radius:99px;color:var(--tx);text-decoration:none;font-size:.92rem}
nav a.on,nav a:hover{background:#fff1ea;color:var(--or2)}
.hero{background:linear-gradient(135deg,#ff6c37,#c9441a);color:#fff;padding:34px 0 38px}
.hero h1{font-size:1.9rem;margin:0 0 6px}.hero p{margin:0 0 16px;opacity:.95;max-width:560px}
.hero input{width:100%;max-width:520px;padding:12px 16px;border-radius:99px;border:0;font:inherit}
h2{font-size:1.3rem;margin:26px 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:5px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chips .on{background:var(--or);border-color:var(--or);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(255,108,55,.07)}
.tn{position:relative;aspect-ratio:16/9;background:#2b1a12;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem}
.tn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tn i{position:relative;background:rgba(0,0,0,.55);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.2rem}
.cb{padding:12px}.cb h3{margin:0 0 6px;font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mut);font-size:.82rem}
.bd{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:99px;margin-right:4px}
.b-true{background:#dff3e8;color:#16794a}.b-false{background:#fbe3e1;color:#b3261e}.b-pending{background:#f3ece6;color:#6f6760}.b-checking{background:#fdf0d0;color:#9a6700}
.bt,.btn{font:inherit;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block;font-size:.9rem}
.or{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}.red{color:#b3261e}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(20,10,5,.7);display:none;z-index:9;overflow:auto;padding:16px}.ov.on{display:block}
.md{background:#fff;max-width:760px;margin:24px auto;border-radius:18px;padding:14px}
.md video{width:100%;max-height:70vh;background:#000;border-radius:12px}
.box{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:9px;margin-bottom:8px;background:#fff;color:var(--tx)}
textarea{min-height:56px}.ck{display:flex;gap:8px;align-items:center;margin:4px 0 8px}.ck input{width:auto;margin:0}
.ad{display:grid;grid-template-columns:150px 1fr;gap:12px}@media(max-width:600px){.ad{grid-template-columns:1fr}}
.ad img,.ad .ph{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#2b1a12}
footer{background:var(--dk);color:#e9dcd3;margin-top:36px;padding:26px 0;font-size:.9rem}footer a{color:#ffb99c}
.empty{text-align:center;color:var(--mut);padding:36px 0}
</style></head><body>
<header><div class="w hd">
<img class="lg" alt="" src="https://base44.app/api/apps/6ae5ec7ba17780758452d46a/files/mp/public/6ae5ec7ba17780758452d46a/2d4b5c52c_file_00000000ad308210afd3be8b55b59494.png" onerror="this.style.display='none'">
<div class="bn"><b>আল আহসান টিভি</b><small>আল আহসান ফাউন্ডেশন বাংলাদেশ</small></div>
<nav><a href="#" id="n1">ভিডিও লাইব্রেরি</a><a href="#admin" id="n2">অ্যাডমিন</a></nav></div></header>
<div id="app"></div>
<footer><div class="w">
<b>আল আহসান ফাউন্ডেশন বাংলাদেশ</b> — মানবতার সেবায় নিবেদিত<br>
দেওয়ানগঞ্জ, জামালপুর, বাংলাদেশ · <a href="mailto:alahsanfoundation.info@gmail.com">alahsanfoundation.info@gmail.com</a> · <a href="https://www.facebook.com/alahsanfoundation.info">ফেসবুক</a><br>
<span style="opacity:.7">© 2026 আল আহসান ফাউন্ডেশন বাংলাদেশ। সর্বস্বত্ব সংরক্ষিত।</span></div></footer>
<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script>
var adm=sessionStorage.getItem('adm')||'',items=[],F='all',Q='';
var ST={pending:'যাচাই বাকি',checking:'যাচাই চলছে',true:'সত্য',false:'মিথ্যা'};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function enc(s){return encodeURIComponent(s)}
function hd(){var h={'Content-Type':'application/json'};if(adm)h['x-admin']=adm;return h}
function dt(s){try{return new Date(s).toLocaleDateString('bn-BD')}catch(e){return ''}}
async function loadLib(){try{var r=await fetch('/api/library',{headers:hd()});items=r.ok?await r.json():[]}catch(e){items=[]}}
function badge(i){return i.status==='true'?'<span class="bd b-true">✅ যাচাইকৃত সত্য</span>':i.status==='false'?'<span class="bd b-false">❌ মিথ্যা প্রমাণিত</span>':''}

async function route(){
  var a=location.hash==='#admin';
  $('n1').className=a?'':'on';$('n2').className=a?'on':'';
  await loadLib();a?adminView():pubView();window.scrollTo(0,0)}
window.onhashchange=route;

/* ---------- public ---------- */
function pubView(){
  $('app').innerHTML='<section class="hero"><div class="w"><h1>আল আহসান টিভি</h1><p>আমাদের সংরক্ষিত ভিডিও লাইব্রেরি — দেখুন, যাচাইকৃত তথ্য জানুন ও ডাউনলোড করুন।</p><input id="q" placeholder="🔍 ভিডিও খুঁজুন..."></div></section>'+
  '<div class="w"><h2>ভিডিও লাইব্রেরি</h2><div class="chips" id="ch"></div><div class="grid" id="gr"></div></div>';
  $('q').oninput=function(){Q=this.value.toLowerCase();pubList()};pubList()}
function pubList(){
  var tabs=[['all','সব'],['true','যাচাইকৃত সত্য'],['false','মিথ্যা প্রমাণিত']];
  $('ch').innerHTML=tabs.map(function(t){return '<button data-f="'+t[0]+'" class="'+(F===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  $('ch').onclick=function(e){var f=e.target.getAttribute('data-f');if(f){F=f;pubList()}};
  var v=items.filter(function(i){return i.published&&(F==='all'||i.status===F)&&(!Q||(i.title+' '+i.desc).toLowerCase().indexOf(Q)>=0)});
  $('gr').innerHTML=v.length?v.map(function(i){return '<div class="cd"><div class="tn" data-p="'+esc(i.id)+'">'+(i.thumb?'<img loading="lazy" alt="" src="'+esc(i.thumb)+'">':'')+'<i>▶</i></div><div class="cb"><h3>'+esc(i.title||'ভিডিও')+'</h3><div>'+badge(i)+'</div><div class="m">'+dt(i.at)+'</div><div class="row"><button class="bt or" data-p="'+esc(i.id)+'">▶ দেখুন</button><a class="bt" href="'+esc(i.video)+'?download=1">⬇ ডাউনলোড</a></div></div></div>'}).join(''):'<div class="empty" style="grid-column:1/-1">এখনো কোনো ভিডিও প্রকাশিত হয়নি।</div>';
  $('gr').onclick=function(e){var p=e.target.closest('[data-p]');if(!p)return;var i=items.filter(function(x){return x.id===p.getAttribute('data-p')})[0];if(i)play(i)}}
function play(i){
  $('md').innerHTML='<video controls autoplay playsinline src="'+esc(i.video)+'" poster="'+esc(i.thumb)+'"></video><h3>'+esc(i.title)+'</h3>'+badge(i)+(i.desc?'<p>'+esc(i.desc).replace(/\n/g,'<br>')+'</p>':'')+
  '<div class="row"><a class="bt or" href="'+esc(i.video)+'?download=1">⬇ ডাউনলোড</a><button class="bt" id="cx">বন্ধ করুন</button></div>';
  $('ov').classList.add('on');$('cx').onclick=cl}
function cl(){$('ov').classList.remove('on');$('md').innerHTML=''}
$('ov').onclick=function(e){if(e.target===this)cl()};

/* ---------- admin ---------- */
async function adminView(){
  if(adm){try{var r=await fetch('/api/library?me=1',{headers:hd()});var j=await r.json();if(!j.admin){adm='';sessionStorage.removeItem('adm')}}catch(e){}}
  if(!adm){$('app').innerHTML='<div class="w"><div class="box" style="max-width:380px;margin:40px auto"><h2 style="margin-top:0">🔐 অ্যাডমিন লগইন</h2><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button class="bt or" style="width:100%" id="lg">প্রবেশ করুন</button><div class="m" id="le"></div></div></div>';
    $('lg').onclick=function(){adm=$('pw').value;sessionStorage.setItem('adm',adm);route()};return}
  $('app').innerHTML='<div class="w"><h2>অ্যাডমিন প্যানেল</h2><div class="box"><b>➕ নতুন ভিডিও সংরক্ষণ</b><input id="fu" type="url" placeholder="ফেসবুক ভিডিও/রিলের লিংক" style="margin-top:8px"><button class="bt or" id="fg">ভিডিও আনুন</button><div id="fr" class="m" style="margin-top:8px"></div></div>'+
  '<h3>সংরক্ষিত ভিডিও ('+items.length+')</h3><div id="al"></div><button class="bt red" id="lo">লগআউট</button></div>';
  $('fg').onclick=fetchInfo;$('lo').onclick=function(){adm='';sessionStorage.removeItem('adm');route()};drawAdmin()}
async function fetchInfo(){
  var u=$('fu').value.trim();if(!/^https:\/\//i.test(u))return alert('সঠিক লিংক দিন');
  $('fr').textContent='⏳ ভিডিও খোঁজা হচ্ছে...';
  try{var r=await fetch('/api/info?url='+enc(u)+'&key='+enc(adm)),j=await r.json();if(!r.ok)throw new Error(j.error||'ব্যর্থ');
    if(!j.formats.length)throw new Error('ডাউনলোডযোগ্য ফাইল পাওয়া যায়নি');
    $('fr').innerHTML=(j.preview?'<video controls playsinline style="width:100%;max-height:40vh;border-radius:10px;background:#000" src="'+esc(j.preview)+'"></video>':'')+
    '<input id="ft" value="'+esc(j.title)+'" placeholder="শিরোনাম"><select id="fq">'+j.formats.map(function(f,k){return '<option value="'+k+'">'+esc(f.label)+(f.size?' · '+(f.size/1048576).toFixed(1)+' MB':'')+'</option>'}).join('')+'</select><button class="bt or" id="fs">💾 ডাটাবেজে সংরক্ষণ করুন</button>';
    $('fs').onclick=function(){var f=j.formats[+$('fq').value];save(u,f,$('ft').value,j.thumbnail)}}
  catch(e){$('fr').textContent='❌ '+e.message}}
async function save(u,f,t,th){
  $('fr').textContent='⏳ ভিডিও সার্ভারে জমা হচ্ছে, ১-২ মিনিট অপেক্ষা করুন। পেজ বন্ধ করবেন না...';
  try{var r=await fetch('/api/save',{method:'POST',headers:hd(),body:JSON.stringify({u:f.url,label:f.label,title:t,thumb:th,source:u})}),j=await r.json();
    if(!r.ok)throw new Error(j.error||'ব্যর্থ');$('fu').value='';await loadLib();adminView()}catch(e){$('fr').textContent='❌ '+e.message}}
function drawAdmin(){
  $('al').innerHTML=items.length?items.map(function(i){return '<div class="box ad" data-id="'+esc(i.id)+'"><div>'+(i.thumb?'<img alt="" src="'+esc(i.thumb)+'">':'<div class="ph"></div>')+'<div class="m">'+dt(i.at)+' · '+esc(i.quality)+'</div></div><div>'+
  '<input class="t" value="'+esc(i.title)+'" placeholder="শিরোনাম">'+
  '<select class="s">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(i.status===k?' selected':'')+'>'+ST[k]+'</option>'}).join('')+'</select>'+
  '<textarea class="d" placeholder="জনসম্মুখে দেখানো বিবরণ">'+esc(i.desc)+'</textarea><textarea class="n" placeholder="ব্যক্তিগত নোট (সূত্র, প্রমাণ)">'+esc(i.note)+'</textarea>'+
  '<label class="ck"><input type="checkbox" class="p"'+(i.published?' checked':'')+'> ওয়েবসাইটে প্রকাশ করুন</label>'+
  '<div class="row"><button class="bt or" data-a="sv">সেভ করুন</button><a class="bt" href="'+esc(i.video)+'?download=1">⬇ ডাউনলোড</a><a class="bt" target="_blank" rel="noopener noreferrer" href="'+esc(i.source)+'">উৎস</a><button class="bt red" data-a="del">🗑 মুছুন</button></div></div></div>'}).join(''):'<div class="empty">এখনো কিছু সংরক্ষণ করা হয়নি।</div>';
  $('al').onclick=async function(e){var a=e.target.getAttribute('data-a');if(!a)return;var c=e.target.closest('.box'),id=c.getAttribute('data-id');
    try{if(a==='sv'){var r=await fetch('/api/library',{method:'PATCH',headers:hd(),body:JSON.stringify({id:id,title:c.querySelector('.t').value,status:c.querySelector('.s').value,desc:c.querySelector('.d').value,note:c.querySelector('.n').value,published:c.querySelector('.p').checked})});if(!r.ok)throw 0;e.target.textContent='✔ সেভ হয়েছে'}
    else if(confirm('ভিডিওটি স্থায়ীভাবে মুছে ফেলবেন?')){var r2=await fetch('/api/library?id='+enc(id),{method:'DELETE',headers:hd()});if(!r2.ok)throw 0;await loadLib();adminView()}}
    catch(x){alert('কাজটি সম্পন্ন হয়নি।')}}}
route();
</script></body></html>
